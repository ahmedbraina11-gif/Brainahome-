<script>
  // جلب وقراءة ملف الإعلانات والأرشيف الخارجي تلقائياً
  async function loadBrainaAnnouncements() {
    try {
      const response = await fetch('announcements.json?v=' + new Date().getTime());
      if (!response.ok) return;
      const brainaAnnouncements = await response.json();

      const now = new Date();
      const topContainer = document.getElementById("bh-top-announcements");
      const archiveBox = document.getElementById("bh-archive-box");
      const archiveList = document.getElementById("bh-archive-list");

      if (!topContainer) return;

      topContainer.innerHTML = "";
      archiveList.innerHTML = "";
      let hasArchived = false;

      brainaAnnouncements.forEach(item => {
        const expiryDate = new Date(item.expiresAt);

        if (now < expiryDate) {
          // عرض شريط التنويه المؤقت في الأعلى
          topContainer.innerHTML += `
            <div class="bh-live-banner">
              <span class="bh-live-badge">${item.badge}</span>
              <span>${item.text}</span>
            </div>
          `;
        } else {
          // نقل الإعلان المنتهي إلى الأرشيف الدائم
          hasArchived = true;
          archiveList.innerHTML += `
            <div class="bh-archive-item">
              <span><strong>[${item.badge}]</strong> ${item.text}</span>
              <span class="bh-archive-date">${item.dateLabel}</span>
            </div>
          `;
        }
      });

      if (hasArchived && archiveBox) {
        archiveBox.style.display = "block";
      }
    } catch (error) {
      console.error("تعذر تحميل التنويهات:", error);
    }
  }

  loadBrainaAnnouncements();
</script>

          text: "<strong>Braina home</strong> olarak yaşam alanınıza özel ölçü, renk ve birinci sınıf malzemelerle özel mobilya üretimi yapıyoruz.<br>Oda ölçülerinizi veya beğendiğiniz modeli WhatsApp'tan gönderin, hemen fiyatlandıralım:",

        price: {

          wa: "Merhaba Braina home, güncel katalog ve fiyat listesini alabilir miyim?"
        },
        location: {
          text: "Mağazamız <strong>Altınşehir, Ümraniye / İstanbul</strong>'dadır. Tüm İstanbul'a teslimat ve kurulum hizmetimiz mevcuttur.<br>Konum bilgisi için bizimle iletişime geçin:",
          wa: "Merhaba Braina home, mağaza adresiniz ve teslimat detayları hakkında bilgi alabilir miyim?"
        },
        whatsapp: {
          text: "Satış ekibimiz tüm sorularınızı yanıtlamak için WhatsApp'ta sizi bekliyor:",
          wa: "Merhaba Braina home, ürünleriniz hakkında bilgi almak istiyorum."
        },
        fallback: (q) => ({
          text: "<strong>Braina home</strong> ile iletişime geçtiğiniz için teşekkürler! Talebinizle ilgili en doğru bilgiyi almak için satış ekibimize tek tıkla WhatsApp'tan ulaşabilirsiniz:",
          wa: `Merhaba Braina home, sorum şu: ${q}`
        })
      }
    },
    en: {
      dir: "ltr",
      status: "Customer Support",
      placeholder: "Type your inquiry here...",
      send: "Send",
      waBtn: "📲 Continue on WhatsApp",
      welcome: "Welcome to <strong>Braina home</strong> Luxury Furniture & Decor ✨<br>How can we assist you today? Choose an option or type your question:",
      quick: [
        { key: "custom", label: "🛋️ Custom Furniture" },
        { key: "price", label: "💰 Prices & Catalog" },
        { key: "location", label: "📍 Location & Delivery" },
        { key: "whatsapp", label: "💬 WhatsApp Chat" }
      ],
      replies: {
        custom: {
          text: "At <strong>Braina home</strong>, we craft bespoke furniture and custom woodwork tailored to your exact dimensions, colors, and premium materials.<br>Send us your room dimensions or inspiration photo on WhatsApp:",
          wa: "Hello Braina home, I would like to inquire about custom-made furniture."
        },
        price: {
          text: "Prices vary based on dimensions and your choice of fabrics, marble, and wood finishes. We would love to share our latest catalog and price list via WhatsApp:",
          wa: "Hello Braina home, could you please share your catalog and price list?"
        },
        location: {
          text: "We are located in <strong>Altınşehir, Ümraniye, Istanbul</strong>, offering delivery and installation across all of Istanbul as well as shipping options.<br>Contact us for the exact pin location:",
          wa: "Hello Braina home, I would like to know your showroom location and delivery details."
        },
        whatsapp: {
          text: "Our team is ready to assist you directly on WhatsApp for any inquiries:",
          wa: "Hello Braina home, I have an inquiry regarding your furniture."
        },
        fallback: (q) => ({
          text: "Thank you for reaching out to <strong>Braina home</strong>! For accurate details regarding your request, connect directly with our sales team on WhatsApp in one click:",
          wa: `Hello Braina home, my inquiry is: ${q}`
        })
      }
    }
  };

  let currentLang = "ar";
  const chatBox = document.getElementById("bh-chat-box");
  const toggleBtn = document.getElementById("bh-chat-toggle");
  const closeBtn = document.getElementById("bh-close-btn");
  const messagesDiv = document.getElementById("bh-messages");
  const userInput = document.getElementById("bh-user-input");

  function bhDetectSiteLanguage() {
    const htmlLang = (document.documentElement.lang || "").toLowerCase();
    const savedLang = (localStorage.getItem("lang") || localStorage.getItem("language") || "").toLowerCase();
    const detected = htmlLang || savedLang || (navigator.language || "").toLowerCase();

    if (detected.startsWith("tr")) return "tr";
    if (detected.startsWith("en")) return "en";
    return "ar";
  }

  function bhSetLanguage(lang) {
    if (!BH_DATA[lang]) lang = "ar";
    currentLang = lang;
    const config = BH_DATA[lang];

    chatBox.style.direction = config.dir;
    document.getElementById("bh-status-text").textContent = config.status;
    userInput.placeholder = config.placeholder;
    document.getElementById("bh-send-btn").textContent = config.send;

    document.querySelectorAll(".bh-lang-btn").forEach(btn => {
      btn.classList.toggle("active", btn.dataset.lang === lang);
    });

    messagesDiv.innerHTML = "";
    bhAppendMessage(config.welcome, false);

    const quickContainer = document.createElement("div");
    quickContainer.className = "bh-quick-replies";
    config.quick.forEach(item => {
      const btn = document.createElement("button");
      btn.className = "bh-quick-btn";
      btn.textContent = item.label;
      btn.onclick = () => bhHandleQuick(item.key, item.label);
      quickContainer.appendChild(btn);
    });
    messagesDiv.appendChild(quickContainer);
  }

  function bhAppendMessage(text, isUser = false, waText = null) {
    const config = BH_DATA[currentLang];
    const msgEl = document.createElement("div");
    msgEl.className = `bh-msg ${isUser ? "bh-msg-user" : "bh-msg-bot"}`;
    msgEl.innerHTML = text;

    if (waText) {
      const waLink = document.createElement("a");
      waLink.className = "bh-wa-action";
      waLink.href = `https://wa.me/${BH_WHATSAPP_NUMBER}?text=${encodeURIComponent(waText)}`;
      waLink.target = "_blank";
      waLink.rel = "noopener noreferrer";
      waLink.textContent = config.waBtn;
      msgEl.appendChild(document.createElement("br"));
      msgEl.appendChild(waLink);
    }

    messagesDiv.appendChild(msgEl);
    messagesDiv.scrollTop = messagesDiv.scrollHeight;
  }

  function bhMatchIntent(query) {
    const q = query.toLowerCase();
    if (/(تفصيل|مقاس|تصميم|خشب|özel|ölçü|tasarım|ahşap|custom|bespoke|size|wood)/.test(q)) return "custom";
    if (/(سعر|أسعار|تكلفة|عروض|بكم|fiyat|katalog|teklif|kampanya|price|cost|catalog|quote)/.test(q)) return "price";
    if (/(موقع|عنوان|توصيل|شحن|اسطنبول|konum|adres|teslimat|kargo|istanbul|ümraniye|location|address|delivery|shipping)/.test(q)) return "location";
    if (/(واتساب|تواصل|رقم|مباشر|whatsapp|iletişim|numara|contact|chat)/.test(q)) return "whatsapp";
    return null;
  }

  function bhHandleQuick(key, label) {
    bhAppendMessage(label, true);
    const reply = BH_DATA[currentLang].replies[key];
    setTimeout(() => {
      bhAppendMessage(reply.text, false, reply.wa);
    }, 300);
  }

  function bhSendMessage() {
    const text = userInput.value.trim();
    if (!text) return;
    bhAppendMessage(text, true);
    userInput.value = "";

    const intent = bhMatchIntent(text);
    const replies = BH_DATA[currentLang].replies;
    const reply = intent ? replies[intent] : replies.fallback(text);

    setTimeout(() => {
      bhAppendMessage(reply.text, false, reply.wa);
    }, 350);
  }

  toggleBtn.addEventListener("click", () => {
    chatBox.style.display = chatBox.style.display === "flex" ? "none" : "flex";
  });

  closeBtn.addEventListener("click", () => {
    chatBox.style.display = "none";
  });

  // 1. ضبط اللغة المبدئية
  bhSetLanguage(bhDetectSiteLanguage());

  // 2. مراقبة تغيير لغة الصفحة تلقائياً عند ضغط الزائر على أزرار لغات الموقع
  const bhLangObserver = new MutationObserver(() => {
    const newSiteLang = bhDetectSiteLanguage();
    if (newSiteLang !== currentLang) {
      bhSetLanguage(newSiteLang);
    }
  });
  bhLangObserver.observe(document.documentElement, {
    attributes: true,
    attributeFilter: ["lang", "dir"]
  });
</script>
