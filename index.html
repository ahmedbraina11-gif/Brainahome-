<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Braina Home</title>
  <meta name="description" content="" id="meta-desc">
  <meta name="theme-color" content="#08281e">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta property="og:title" content="Braina Home">
  <meta property="og:image" content="https://www.brainahome.com/logo-full.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Marcellus&family=Montserrat:wght@400;500;600&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="top">
  <a class="brand" href="#top" aria-label="Braina Home">
    <img src="favicon.png" alt="" width="44" height="44">
    <span class="brand-name">Braina <small>Home</small></span>
  </a>
  <nav class="nav" aria-label="main">
    <a href="#about" data-i18n="nav.about"></a>
    <a href="#gallery" data-i18n="nav.gallery"></a>
    <a href="#contact" data-i18n="nav.contact"></a>
  </nav>
  <div class="langs" role="group" aria-label="Language">
    <button type="button" data-lang="ar" lang="ar">العربية</button>
    <button type="button" data-lang="en" lang="en">EN</button>
    <button type="button" data-lang="tr" lang="tr">TR</button>
  </div>
</header>

<main id="top">

  <section class="hero">
    <div class="hero-logo">
      <div class="arch">
        <img src="logo-full.jpg" width="1269" height="1239" alt="Braina Home">
      </div>
    </div>
    <div class="hero-text">
      <h1 data-i18n="hero.title"></h1>
      <p data-i18n="hero.text"></p>
      <div class="actions">
        <a class="btn btn-solid" id="hero-wa" href="#contact" target="_blank" rel="noopener" data-i18n="hero.wa"></a>
        <a class="btn btn-line" href="#gallery" data-i18n="hero.gallery"></a>
      </div>
    </div>
  </section>

  <section class="band marble" id="about">
    <div class="wrap about">
      <div>
        <h2 data-i18n="about.title"></h2>
        <p data-i18n="about.text"></p>
      </div>
      <div>
        <h3 data-i18n="about.list_title"></h3>
        <ul class="makes" id="makes"></ul>
      </div>
    </div>
  </section>

  <section class="band velvet" id="gallery">
    <div class="wrap">
      <h2 data-i18n="gallery.title"></h2>
      <div class="tabs" id="tabs" role="tablist" data-i18n-aria="gallery.albums"></div>
      <div class="grid" id="grid"></div>
      <p class="empty" id="empty" hidden data-i18n="gallery.empty"></p>
    </div>
  </section>

  <section class="band marble" id="contact">
    <div class="wrap">
      <h2 data-i18n="contact.title"></h2>
      <div class="contact">
        <div class="contact-info">
          <h3 data-i18n="contact.address_title"></h3>
          <p class="address" data-i18n="contact.address"></p>
          <a class="textlink" id="map-link" href="#" target="_blank" rel="noopener" data-i18n="contact.map"></a>

          <h3 data-i18n="contact.phones_title"></h3>
          <ul class="phones" id="phones"></ul>

          <h3 data-i18n="contact.email_title"></h3>
          <p><a class="textlink" id="email" href="#"></a></p>

          <h3 data-i18n="contact.web_title"></h3>
          <p><a class="textlink" id="web" href="#" target="_blank" rel="noopener"></a></p>
        </div>
        <div class="map">
          <iframe id="map" title="Map" loading="lazy" referrerpolicy="no-referrer-when-downgrade" allowfullscreen></iframe>
        </div>
      </div>
    </div>
  </section>
</main>

<footer class="foot">
  <img src="favicon.png" alt="" width="36" height="36">
  <span>© <span id="year"></span> Braina Home. <span data-i18n="footer.rights"></span></span>
</footer>

<a class="float-wa" id="float-wa" href="#" target="_blank" rel="noopener" aria-label="WhatsApp">
  <svg viewBox="0 0 32 32" width="28" height="28" aria-hidden="true"><path fill="currentColor" d="M16.02 3C9.4 3 4.04 8.36 4.04 14.98c0 2.35.68 4.63 1.96 6.6L4 29l7.6-1.97a11.9 11.9 0 0 0 4.42 .85h.01c6.61 0 11.98-5.37 11.98-11.98C28 8.36 22.63 3 16.02 3Zm0 21.8h-.01a9.9 9.9 0 0 1-5.04-1.38l-.36-.21-4.51 1.17 1.2-4.4-.24-.37a9.86 9.86 0 0 1-1.52-5.26c0-5.46 4.45-9.9 9.92-9.9 5.46 0 9.9 4.44 9.9 9.9 0 5.47-4.44 9.45-9.34 9.45Zm5.43-7.4c-.3-.15-1.76-.87-2.03-.97-.27-.1-.47-.15-.67.15-.2.3-.77.97-.94 1.17-.17.2-.35.22-.65.07-.3-.15-1.26-.46-2.4-1.48-.89-.79-1.49-1.77-1.66-2.07-.17-.3-.02-.46.13-.61.14-.13.3-.35.45-.52.15-.17.2-.3.3-.5.1-.2.05-.37-.02-.52-.08-.15-.67-1.62-.92-2.22-.24-.58-.49-.5-.67-.51h-.57c-.2 0-.52.07-.8.37-.27.3-1.04 1.02-1.04 2.48 0 1.46 1.07 2.88 1.22 3.08.15.2 2.1 3.2 5.08 4.49.71.31 1.26.49 1.7.63.71.23 1.36.2 1.87.12.57-.08 1.76-.72 2-1.41.25-.69.25-1.29.17-1.41-.07-.12-.27-.2-.57-.35Z"/></svg>
</a>

<dialog class="lightbox" id="lightbox" aria-label="Photo viewer">
  <button type="button" class="lb-close" id="lb-close"></button>
  <button type="button" class="lb-nav lb-prev" id="lb-prev"></button>
  <img id="lb-img" alt="">
  <button type="button" class="lb-nav lb-next" id="lb-next"></button>
  <p class="lb-count" id="lb-count"></p>
</dialog>

<script src="app.js"></script>
</body>
</html>
